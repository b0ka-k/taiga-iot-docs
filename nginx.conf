server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep :3002 in redirects (default nginx drops the port)
  absolute_redirect off;
  port_in_redirect on;

  # /docs/ has no index.html → nginx 403; send users to intro
  location = /docs {
    return 302 /docs/intro/;
  }
  location = /docs/ {
    return 302 /docs/intro/;
  }

  # Old Badge-LW URL after move into subcategory folder
  location = /docs/products/badge-lw {
    return 302 /docs/products/Badge-LW/overview/;
  }
  location = /docs/products/badge-lw/ {
    return 302 /docs/products/Badge-LW/overview/;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
