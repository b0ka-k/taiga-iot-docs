server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  absolute_redirect off;
  port_in_redirect on;

  # HTML must revalidate so users don't see old sidebar after deploy
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location = /docs {
    return 302 /docs/products/badge-lw/overview/;
  }
  location = /docs/ {
    return 302 /docs/products/badge-lw/overview/;
  }

  # Old flat page URL (before subcategory)
  location = /docs/products/badge-lw {
    return 302 /docs/products/badge-lw/overview/;
  }
  location = /docs/products/badge-lw/ {
    return 302 /docs/products/badge-lw/overview/;
  }

  # Old CamelCase folder from previous deploy
  location ~ ^/docs/products/Badge-LW(/.*)?$ {
    return 302 /docs/products/badge-lw/overview/;
  }

  # Fingerprinted assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
